# cargo-deny license audit for tpt-visual.
#
# Only permissive licenses are allowed. cargo-deny v2 semantics: every
# license NOT in `allow` is rejected (the explicit `deny` key was removed in
# cargo-deny 0.20 — denying GPL/LGPL/AGPL/MPL is the default), and crates
# without a detectable license are always rejected.
#
# See CONTRIBUTING.md for the dependency policy and spec section 8 for the
# rationale.

[licenses]
version = 2

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    # Public-domain-equivalent / MIT-compatible, pulled in transitively:
    "CC0-1.0",       # hexf-parse (via naga/wgsl)
    "Unicode-3.0",   # unicode-ident and friends
]

confidence-threshold = 0.93

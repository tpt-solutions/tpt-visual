# cargo-deny license audit for tpt-visual.
#
# Only permissive licenses are allowed. All copyleft licenses are denied and
# any dependency without a detected license is denied. See CONTRIBUTING.md for
# the dependency policy and spec section 8 for the rationale.

[licenses]
version = 2
unlicensed = "deny"

allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]

deny = [
    "GPL-2.0",
    "GPL-3.0",
    "LGPL-2.1",
    "LGPL-3.0",
    "AGPL-3.0",
    "MPL-2.0",
]

confidence-threshold = 0.93
